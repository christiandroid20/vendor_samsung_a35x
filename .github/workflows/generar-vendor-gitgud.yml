name: Generar vendor real desde dump de gitgud

# Clona el dump de gitgud (runner con internet completo) y corre
# nuestro propio extract-files.sh contra el, en modo firmware (no ADB) --
# genera proprietary/ + Android.mk + a35x-vendor.mk de verdad, y lo
# sube a main. Usa proprietary-files.txt tal como está en el repo en
# este momento.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar dump de gitgud
        run: |
          rm -rf /tmp/gitgud_dump
          git clone --depth=1 https://gitgud.io/Van-Firmware-Dumps/samsung/a35x.git /tmp/gitgud_dump

      - name: Clonar vendor_samsung_a35x
        run: |
          rm -rf /tmp/vendor_repo
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/vendor_repo

      - name: Correr extract-vendor-full.sh contra el dump
        run: |
          cd /tmp/vendor_repo
          chmod +x extract-vendor-full.sh setup-makefiles.sh
          ./extract-vendor-full.sh /tmp/gitgud_dump

      - name: Commit y push a main
        run: |
          cd /tmp/vendor_repo
          git config user.email "actions@github.com"
          git config user.name "gitgud-vendor-bot"
          # Mitigar el mismo error de push grande que ya vimos antes
          # (HTTP 500 / "unexpected disconnect while reading sideband
          # packet") -- vendor/ completo puede pesar bastante.
          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios -- extract-vendor-full.sh no encontró nada nuevo."
            exit 0
          fi
          git commit -m "Generar vendor tree completo desde el dump de gitgud (via extract-vendor-full.sh)"
          git push origin main
